name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Write donations config
        env:
          DONATIONS_CONFIG_JSON: ${{ secrets.DONATIONS_CONFIG_JSON }}
        run: |
          if [ -n "$DONATIONS_CONFIG_JSON" ]; then
            printf '%s' "$DONATIONS_CONFIG_JSON" > src/config/donations.config.json
          else
            node scripts/ensure-donations-config.mjs
          fi

      - name: Set base path
        id: base_path
        run: |
          # Use / for custom domain (e.g. mtpctennis.com). Use repo path only for *.github.io project pages.
          echo "base=/" >> $GITHUB_OUTPUT

      - name: Build
        run: yarn build
        env:
          VITE_BASE: ${{ steps.base_path.outputs.base }}
          VITE_STRIPE_LINK_ONETIME: ${{ secrets.VITE_STRIPE_LINK_ONETIME }}
          VITE_STRIPE_LINK_MONTHLY: ${{ secrets.VITE_STRIPE_LINK_MONTHLY }}
          VITE_CHARIOT_CID: ${{ secrets.VITE_CHARIOT_CID }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
